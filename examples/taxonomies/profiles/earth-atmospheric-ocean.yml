schema_version: 1
version: "1.0.0"

description: >
  Covers geology, geophysics, geochemistry, atmospheric science, hydrology, oceanography, physical geography and planetary-scale Earth processes.

conventions:
  separator: "/"
  canonical_tag_format: "{namespace}/{value}"
  allow_unlisted_values: false
  prefer_precision_over_recall: true
  avoid_metadata_duplication: true
  metadata_fields_not_to_tag:
    - author
    - journal
    - year
    - doi
    - publisher
    - institution
  notes:
    - "Collections/folders organize projects; tags reflect intrinsic content."
    - "Role describes contribution style (empirical, theoretical, review, method)."
    - "Topic describes substantive domain questions, phenomena, or theories."
    - "System describes the physical, biological, conceptual, or social entity investigated."
    - "Method describes specific investigative techniques, protocols, or models."
    - "Status and priority are human-managed workflow namespaces."

classifier:
  semantic_namespaces:
    - role
    - topic
    - system
    - method
  workflow_namespaces:
    - status
  human_only_namespaces:
    - priority
  rules:
    - "Never invent a tag not defined in this taxonomy."
    - "Do not tag a concept merely because it is mentioned in passing."
    - "Prefer the most specific applicable canonical tag without adding redundant synonyms."
    - "Do not infer priority or reading status from document content."
    - "Use aliases only for recognition and normalisation; always emit the canonical tag."

relationships: []

namespaces:

  status:
    description: "Reading and processing workflow state."
    kind: workflow
    classifier_eligible: false
    max_tags: 1
    mutually_exclusive: true
    user_managed:
      - reading
      - read
      - processed
    values:
      needs-triage:
        description: "Item requires human review or candidate tags await confirmation."
        aliases: ["triage", "needs review", "needs-review"]
      to-read:
        description: "Item has been queued into the reading list."
        aliases: ["unread", "to read", "to_read"]
      reading:
        description: "Item is actively being read."
      read:
        description: "Item has been read and understood."
        aliases: ["done"]
      processed:
        description: "Notes or knowledge have been extracted into broader research workflow."

  priority:
    description: "User judgement about importance or urgency to revisit."
    kind: judgement
    classifier_eligible: false
    max_tags: 2
    values:
      core:
        description: "Foundational reference essential to ongoing projects."
        aliases: ["essential", "seminal", "must-read", "foundational"]
      high:
        description: "Highly relevant paper containing important results or techniques."
        aliases: ["important", "key-reference"]
      revisit:
        description: "Contains specific derivations, tables, or parameters to revisit later."
        aliases: ["bookmark", "check-later", "reference-back"]

  role:
    description: "Contribution style or epistemic purpose the work serves in the literature."
    kind: semantic
    classifier_eligible: true
    max_tags: 2
    values:
      review:
        description: "Synthesises an established body of literature rather than presenting only a single narrow result."
        aliases: ["review article", "survey", "overview", "systematic review", "meta-analysis"]
      empirical:
        description: "Presents primary empirical data, field/laboratory observations, or experimental measurements."
        aliases: ["experimental", "empirical study", "measurement", "observational study"]
      theoretical:
        description: "Develops formal analytical theory, mathematical derivations, or conceptual frameworks."
        aliases: ["theory", "analytical model", "conceptual framework", "formal derivation"]
      methodological:
        description: "Introduces or evaluates a new algorithm, experimental protocol, measurement tool, or analytical workflow."
        aliases: ["methodology", "algorithm development", "protocol", "new method"]
      computational:
        description: "Presents numerical simulations, scientific computing models, or computational software tools."
        aliases: ["simulation", "in silico", "numerical study", "computational model"]
      application:
        description: "Applies established methodologies to investigate a specific domain target or practical case study."
        aliases: ["case study", "applied study", "field application"]
      commentary:
        description: "Editorial, commentary, position paper, or perspective on field directions."
        aliases: ["perspective", "editorial", "position paper", "opinion"]

  topic:
    description: "Substantive domain phenomena, research questions, theories, or mechanisms."
    kind: semantic
    classifier_eligible: true
    max_tags: 4
    values:
      geology:
        description: "Sedimentology, structural geology, plate tectonics, stratigraphy, and petrology."
        aliases: ["tectonics", "sedimentology", "petrology", "stratigraphy", "volcanology"]
      geophysics:
        description: "Seismology, geomagnetism, gravity surveying, geodynamics, and exploration geophysics."
        aliases: ["seismology", "geomagnetism", "geodynamics", "seismic survey"]
      geochemistry:
        description: "Isotope geochemistry, mineral-water reactions, biogeochemistry, and geochronology."
        aliases: ["isotope", "geochronology", "radiometric dating", "mineral reaction"]
      atmospheric-science:
        description: "Atmospheric dynamics, cloud microphysics, meteorology, aerosol chemistry, and weather forecasting."
        aliases: ["meteorology", "aerosol", "atmospheric chemistry", "weather forecast", "boundary layer"]
      hydrology:
        description: "Surface water flow, groundwater aquifers, catchment modeling, watershed dynamics, and flood risk."
        aliases: ["groundwater", "aquifer", "catchment", "watershed", "river runoff", "flood modeling"]
      oceanography:
        description: "Physical oceanography, thermohaline circulation, marine biogeochemistry, tides, and waves."
        aliases: ["ocean circulation", "marine chemistry", "thermohaline", "ocean current", "sea surface temperature"]
      climate-science:
        description: "Global climate modeling, paleoclimate reconstructions, greenhouse warming, and climate tipping points."
        aliases: ["climate modeling", "paleoclimate", "global warming", "IPCC", "climate feedback"]
      geoscience:
        description: "Mineral exploration, geomorphology, remote sensing, and planetary geology."
        aliases: ["mineral exploration", "geomorphology", "remote sensing", "planetary geology"]

  system:
    description: "Physical, biological, social, or computational entity under primary study."
    kind: semantic
    classifier_eligible: true
    max_tags: 3
    values:
      planetary-spheres:
        description: "Atmosphere, lithosphere, hydrosphere, cryosphere, and oceanic water column."
        aliases: ["atmosphere", "ocean", "lithosphere", "ice sheet", "glacier"]
      geological-formations:
        description: "Sedimentary basins, volcanic arcs, fault zones, and mineral deposits."
        aliases: ["fault zone", "sedimentary basin", "volcano", "ore deposit"]
      catchments-and-aquifers:
        description: "River catchments, groundwater aquifers, estuaries, and deltaic systems."
        aliases: ["river basin", "aquifer", "estuary", "watershed"]
      oceanic-basins:
        description: "Deep sea trenches, continental shelves, gyres, and coral reef ecosystems."
        aliases: ["continental shelf", "ocean gyre", "deep sea"]

  method:
    description: "Investigative, computational, analytical, or experimental techniques applied."
    kind: semantic
    classifier_eligible: true
    max_tags: 3
    values:
      climate-and-earth-modeling:
        description: "Coupled general circulation models (GCMs), WRF numerical weather models, and hydro-models."
        aliases: ["GCM", "WRF", "earth system model", "numerical weather model"]
      isotope-and-mass-spectrometry:
        description: "Stable isotope ratios, radiocarbon dating, ICP-MS, and laser ablation analysis."
        aliases: ["ICP-MS", "stable isotope", "radiocarbon", "argon dating"]
      seismic-and-geophysical-survey:
        description: "Seismic reflection/refraction, magnetotellurics, and gravimetry."
        aliases: ["seismic reflection", "magnetotellurics", "gravity survey"]
      satellite-remote-sensing:
        description: "Synthetic aperture radar (SAR), satellite altimetry, lidar, and multispectral Earth observation."
        aliases: ["InSAR", "altimetry", "satellite observation", "lidar"]
      field-sampling-drilling:
        description: "Ice cores, ocean sediment cores, borehole drilling, and hydrological field logging."
        aliases: ["ice core", "sediment core", "borehole", "water sampling"]
