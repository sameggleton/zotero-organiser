schema_version: 1
version: "1.0.0"

description: >
  Cross-disciplinary profile for general academic literature, research methodology, higher education, and scientific communication.

conventions:
  separator: "/"
  canonical_tag_format: "{namespace}/{value}"
  allow_unlisted_values: false
  prefer_precision_over_recall: true
  avoid_metadata_duplication: true
  metadata_fields_not_to_tag:
    - author
    - journal
    - year
    - doi
    - publisher
    - institution
  notes:
    - "Collections/folders organize projects; tags reflect intrinsic content."
    - "Role describes contribution style (empirical, theoretical, review, method)."
    - "Topic describes substantive domain questions, phenomena, or theories."
    - "System describes the physical, biological, conceptual, or social entity investigated."
    - "Method describes specific investigative techniques, protocols, or models."
    - "Status and priority are human-managed workflow namespaces."

classifier:
  semantic_namespaces:
    - role
    - topic
    - system
    - method
  workflow_namespaces:
    - status
  human_only_namespaces:
    - priority
  rules:
    - "Never invent a tag not defined in this taxonomy."
    - "Do not tag a concept merely because it is mentioned in passing."
    - "Prefer the most specific applicable canonical tag without adding redundant synonyms."
    - "Do not infer priority or reading status from document content."
    - "Use aliases only for recognition and normalisation; always emit the canonical tag."

relationships: []

namespaces:

  status:
    description: "Reading and processing workflow state."
    kind: workflow
    classifier_eligible: false
    max_tags: 1
    mutually_exclusive: true
    user_managed:
      - reading
      - read
      - processed
    values:
      needs-triage:
        description: "Item requires human review or candidate tags await confirmation."
        aliases: ["triage", "needs review", "needs-review"]
      to-read:
        description: "Item has been queued into the reading list."
        aliases: ["unread", "to read", "to_read"]
      reading:
        description: "Item is actively being read."
      read:
        description: "Item has been read and understood."
        aliases: ["done"]
      processed:
        description: "Notes or knowledge have been extracted into broader research workflow."

  priority:
    description: "User judgement about importance or urgency to revisit."
    kind: judgement
    classifier_eligible: false
    max_tags: 2
    values:
      core:
        description: "Foundational reference essential to ongoing projects."
        aliases: ["essential", "seminal", "must-read", "foundational"]
      high:
        description: "Highly relevant paper containing important results or techniques."
        aliases: ["important", "key-reference"]
      revisit:
        description: "Contains specific derivations, tables, or parameters to revisit later."
        aliases: ["bookmark", "check-later", "reference-back"]

  role:
    description: "Contribution style or epistemic purpose the work serves in the literature."
    kind: semantic
    classifier_eligible: true
    max_tags: 2
    values:
      review:
        description: "Synthesises an established body of literature rather than presenting only a single narrow result."
        aliases: ["review article", "survey", "overview", "systematic review", "meta-analysis"]
      empirical:
        description: "Presents primary empirical data, field/laboratory observations, or experimental measurements."
        aliases: ["experimental", "empirical study", "measurement", "observational study"]
      theoretical:
        description: "Develops formal analytical theory, mathematical derivations, or conceptual frameworks."
        aliases: ["theory", "analytical model", "conceptual framework", "formal derivation"]
      methodological:
        description: "Introduces or evaluates a new algorithm, experimental protocol, measurement tool, or analytical workflow."
        aliases: ["methodology", "algorithm development", "protocol", "new method"]
      computational:
        description: "Presents numerical simulations, scientific computing models, or computational software tools."
        aliases: ["simulation", "in silico", "numerical study", "computational model"]
      application:
        description: "Applies established methodologies to investigate a specific domain target or practical case study."
        aliases: ["case study", "applied study", "field application"]
      commentary:
        description: "Editorial, commentary, position paper, or perspective on field directions."
        aliases: ["perspective", "editorial", "position paper", "opinion"]

  topic:
    description: "Substantive domain phenomena, research questions, theories, or mechanisms."
    kind: semantic
    classifier_eligible: true
    max_tags: 4
    values:
      research-design:
        description: "Methodology, experimental design, causal inference, and validity."
        aliases: ["methodology", "study design", "experimental design"]
      open-science:
        description: "Reproducibility, open data, preprints, preregistration, and open access."
        aliases: ["reproducibility", "replication", "open data", "preregistration"]
      scholarly-communication:
        description: "Peer review, scientometrics, academic publishing, and citation dynamics."
        aliases: ["scientometrics", "bibliometrics", "peer review", "publishing"]
      science-policy:
        description: "Research funding, science governance, societal impact, and technology policy."
        aliases: ["research funding", "research policy", "innovation policy"]
      research-ethics:
        description: "Research integrity, human subject protections, dual-use research, and ethical oversight."
        aliases: ["bioethics", "research integrity", "IRB", "academic ethics"]
      interdisciplinary-studies:
        description: "Cross-boundary research, synthesis frameworks, and convergent science."
        aliases: ["multidisciplinary", "transdisciplinary", "convergence"]
      higher-education:
        description: "Academic institutions, doctoral training, university administration, and pedagogy."
        aliases: ["academia", "university", "doctoral education"]
      data-infrastructure:
        description: "Research data management, FAIR principles, archives, and scholarly repositories."
        aliases: ["FAIR data", "data repositories", "research data"]

  system:
    description: "Physical, biological, social, or computational entity under primary study."
    kind: semantic
    classifier_eligible: true
    max_tags: 3
    values:
      academic-institutions:
        description: "Universities, research institutes, colleges, and scholarly associations."
        aliases: ["university", "institute", "faculty"]
      scholarly-literature:
        description: "Journal articles, preprints, conference proceedings, and monographs."
        aliases: ["literature", "papers", "monographs"]
      research-community:
        description: "Scientists, scholarly networks, peer reviewers, and scientific disciplines."
        aliases: ["researchers", "scholars", "scientific network"]
      funding-bodies:
        description: "National funding agencies, philanthropic foundations, and grant schemes."
        aliases: ["grant agency", "funding agency", "NSF", "ERC"]
      research-infrastructure:
        description: "Shared computing facilities, research laboratories, and institutional repositories."
        aliases: ["facilities", "shared lab", "supercomputer"]

  method:
    description: "Investigative, computational, analytical, or experimental techniques applied."
    kind: semantic
    classifier_eligible: true
    max_tags: 3
    values:
      experiment:
        description: "Controlled lab, field, or online experimental procedures."
        aliases: ["controlled trial", "lab experiment", "field experiment"]
      simulation:
        description: "Numerical, agent-based, or synthetic computational simulation."
        aliases: ["computational simulation", "agent-based model"]
      survey:
        description: "Questionnaires, stratified sampling, and cross-sectional survey instruments."
        aliases: ["questionnaire", "sample survey", "polling"]
      qualitative:
        description: "Interviews, focus groups, thematic analysis, and ethnographic fieldwork."
        aliases: ["thematic analysis", "interviews", "fieldwork"]
      literature-synthesis:
        description: "Systematic reviews, meta-analyses, and scoping reviews."
        aliases: ["meta-analysis", "systematic review", "scoping review"]
      quantitative-analysis:
        description: "Statistical regression, econometric estimation, and observational data analysis."
        aliases: ["regression", "multivariate analysis", "statistics"]
