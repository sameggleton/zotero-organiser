schema_version: 1
version: "1.0.0"

description: >
  Covers fundamental and applied physical sciences from quantum and condensed-matter physics through particle, nuclear, plasma, optical, astronomical and space sciences.

conventions:
  separator: "/"
  canonical_tag_format: "{namespace}/{value}"
  allow_unlisted_values: false
  prefer_precision_over_recall: true
  avoid_metadata_duplication: true
  metadata_fields_not_to_tag:
    - author
    - journal
    - year
    - doi
    - publisher
    - institution
  notes:
    - "Collections/folders organize projects; tags reflect intrinsic content."
    - "Role describes contribution style (empirical, theoretical, review, method)."
    - "Topic describes substantive domain questions, phenomena, or theories."
    - "System describes the physical, biological, conceptual, or social entity investigated."
    - "Method describes specific investigative techniques, protocols, or models."
    - "Status and priority are human-managed workflow namespaces."

classifier:
  semantic_namespaces:
    - role
    - topic
    - system
    - method
  workflow_namespaces:
    - status
  human_only_namespaces:
    - priority
  rules:
    - "Never invent a tag not defined in this taxonomy."
    - "Do not tag a concept merely because it is mentioned in passing."
    - "Prefer the most specific applicable canonical tag without adding redundant synonyms."
    - "Do not infer priority or reading status from document content."
    - "Use aliases only for recognition and normalisation; always emit the canonical tag."

relationships: []

namespaces:

  status:
    description: "Reading and processing workflow state."
    kind: workflow
    classifier_eligible: false
    max_tags: 1
    mutually_exclusive: true
    user_managed:
      - reading
      - read
      - processed
    values:
      needs-triage:
        description: "Item requires human review or candidate tags await confirmation."
        aliases: ["triage", "needs review", "needs-review"]
      to-read:
        description: "Item has been queued into the reading list."
        aliases: ["unread", "to read", "to_read"]
      reading:
        description: "Item is actively being read."
      read:
        description: "Item has been read and understood."
        aliases: ["done"]
      processed:
        description: "Notes or knowledge have been extracted into broader research workflow."

  priority:
    description: "User judgement about importance or urgency to revisit."
    kind: judgement
    classifier_eligible: false
    max_tags: 2
    values:
      core:
        description: "Foundational reference essential to ongoing projects."
        aliases: ["essential", "seminal", "must-read", "foundational"]
      high:
        description: "Highly relevant paper containing important results or techniques."
        aliases: ["important", "key-reference"]
      revisit:
        description: "Contains specific derivations, tables, or parameters to revisit later."
        aliases: ["bookmark", "check-later", "reference-back"]

  role:
    description: "Contribution style or epistemic purpose the work serves in the literature."
    kind: semantic
    classifier_eligible: true
    max_tags: 2
    values:
      review:
        description: "Synthesises an established body of literature rather than presenting only a single narrow result."
        aliases: ["review article", "survey", "overview", "systematic review", "meta-analysis"]
      empirical:
        description: "Presents primary empirical data, field/laboratory observations, or experimental measurements."
        aliases: ["experimental", "empirical study", "measurement", "observational study"]
      theoretical:
        description: "Develops formal analytical theory, mathematical derivations, or conceptual frameworks."
        aliases: ["theory", "analytical model", "conceptual framework", "formal derivation"]
      methodological:
        description: "Introduces or evaluates a new algorithm, experimental protocol, measurement tool, or analytical workflow."
        aliases: ["methodology", "algorithm development", "protocol", "new method"]
      computational:
        description: "Presents numerical simulations, scientific computing models, or computational software tools."
        aliases: ["simulation", "in silico", "numerical study", "computational model"]
      application:
        description: "Applies established methodologies to investigate a specific domain target or practical case study."
        aliases: ["case study", "applied study", "field application"]
      commentary:
        description: "Editorial, commentary, position paper, or perspective on field directions."
        aliases: ["perspective", "editorial", "position paper", "opinion"]

  topic:
    description: "Substantive domain phenomena, research questions, theories, or mechanisms."
    kind: semantic
    classifier_eligible: true
    max_tags: 4
    values:
      quantum-physics:
        description: "Quantum information, quantum optics, entanglement, quantum foundations, and quantum error correction."
        aliases: ["quantum information", "entanglement", "quantum computing", "qubit", "quantum optics"]
      condensed-matter:
        description: "Superconductivity, topological states, magnetic materials, electronic transport, and 2D materials."
        aliases: ["superconductivity", "topological insulator", "semiconductor", "2D materials", "magnetism"]
      particle-physics:
        description: "Standard model, collider physics, Higgs physics, neutrino oscillations, and beyond-standard-model theory."
        aliases: ["standard model", "collider", "higgs", "neutrino", "dark matter", "QFT"]
      nuclear-physics:
        description: "Nuclear structure, heavy-ion collisions, quark-gluon plasma, and nuclear astrophysics."
        aliases: ["nuclear structure", "heavy ion", "quark gluon plasma", "fission", "fusion"]
      optics:
        description: "Lasers, non-linear optics, photonics, plasmonics, metamaterials, and ultrafast spectroscopy."
        aliases: ["photonics", "laser", "metamaterial", "plasmonics", "nonlinear optics"]
      plasma-physics:
        description: "Magnetic confinement fusion (tokamaks), laser-plasma acceleration, space plasmas, and MHD."
        aliases: ["tokamak", "fusion plasma", "MHD", "plasma acceleration"]
      astrophysics:
        description: "Stellar evolution, compact objects (black holes/neutron stars), galaxies, and gravitational waves."
        aliases: ["black hole", "neutron star", "galaxy", "gravitational wave", "supernova"]
      space-science:
        description: "Cosmology, cosmic microwave background, exoplanetary systems, and solar physics."
        aliases: ["cosmology", "CMB", "exoplanet", "heliophysics", "dark energy"]

  system:
    description: "Physical, biological, social, or computational entity under primary study."
    kind: semantic
    classifier_eligible: true
    max_tags: 3
    values:
      quantum-devices:
        description: "Superconducting qubits, trapped ions, Rydberg atoms, and photonic circuits."
        aliases: ["qubit", "trapped ion", "rydberg atom", "quantum circuit"]
      solid-state-materials:
        description: "Crystals, thin films, heterostructures, superconductors, and topological matter."
        aliases: ["crystal", "heterostructure", "superconductor", "thin film"]
      astrophysical-objects:
        description: "Black holes, active galactic nuclei (AGN), pulsars, stars, and exoplanets."
        aliases: ["black hole", "pulsar", "star", "exoplanet", "galaxy cluster"]
      plasma-confinements:
        description: "Tokamaks, stellarators, laser targets, and astrophysical accretion disks."
        aliases: ["tokamak", "stellarator", "accretion disk"]
      particle-accelerators:
        description: "Colliders (LHC), synchrotron sources, and underground particle detectors."
        aliases: ["collider", "synchrotron", "LHC", "detector"]

  method:
    description: "Investigative, computational, analytical, or experimental techniques applied."
    kind: semantic
    classifier_eligible: true
    max_tags: 3
    values:
      theoretical-derivation:
        description: "Quantum field theory calculations, perturbation expansions, and analytical mechanics."
        aliases: ["QFT calculation", "feynman diagram", "analytical derivation"]
      astronomical-observation:
        description: "Radio/optical telescopes, space observatories, spectroscopy, and interferometer imaging."
        aliases: ["telescope", "spectroscopy", "JWST", "interferometry"]
      numerical-simulation:
        description: "N-body gravity, magnetohydrodynamic (MHD), ab initio DFT, and particle-in-cell (PIC)."
        aliases: ["N-body", "MHD simulation", "PIC", "DFT"]
      laboratory-experiment:
        description: "Cryogenic measurements, optical setups, beam experiments, and ultrafast laser probes."
        aliases: ["cryogenics", "laser probe", "spectroscopic measurement"]
      data-reconstruction:
        description: "Gravitational-wave parameter estimation, particle track reconstruction, and imaging pipelines."
        aliases: ["event reconstruction", "parameter estimation", "bayesian fit"]
