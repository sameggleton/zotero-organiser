schema_version: 1
version: "1.0.0"

description: >
  Covers electrical, mechanical, chemical, civil, aerospace, biomedical, environmental, manufacturing, materials and control engineering.

conventions:
  separator: "/"
  canonical_tag_format: "{namespace}/{value}"
  allow_unlisted_values: false
  prefer_precision_over_recall: true
  avoid_metadata_duplication: true
  metadata_fields_not_to_tag:
    - author
    - journal
    - year
    - doi
    - publisher
    - institution
  notes:
    - "Collections/folders organize projects; tags reflect intrinsic content."
    - "Role describes contribution style (empirical, theoretical, review, method)."
    - "Topic describes substantive domain questions, phenomena, or theories."
    - "System describes the physical, biological, conceptual, or social entity investigated."
    - "Method describes specific investigative techniques, protocols, or models."
    - "Status and priority are human-managed workflow namespaces."

classifier:
  semantic_namespaces:
    - role
    - topic
    - system
    - method
  workflow_namespaces:
    - status
  human_only_namespaces:
    - priority
  rules:
    - "Never invent a tag not defined in this taxonomy."
    - "Do not tag a concept merely because it is mentioned in passing."
    - "Prefer the most specific applicable canonical tag without adding redundant synonyms."
    - "Do not infer priority or reading status from document content."
    - "Use aliases only for recognition and normalisation; always emit the canonical tag."

relationships: []

namespaces:

  status:
    description: "Reading and processing workflow state."
    kind: workflow
    classifier_eligible: false
    max_tags: 1
    mutually_exclusive: true
    user_managed:
      - reading
      - read
      - processed
    values:
      needs-triage:
        description: "Item requires human review or candidate tags await confirmation."
        aliases: ["triage", "needs review", "needs-review"]
      to-read:
        description: "Item has been queued into the reading list."
        aliases: ["unread", "to read", "to_read"]
      reading:
        description: "Item is actively being read."
      read:
        description: "Item has been read and understood."
        aliases: ["done"]
      processed:
        description: "Notes or knowledge have been extracted into broader research workflow."

  priority:
    description: "User judgement about importance or urgency to revisit."
    kind: judgement
    classifier_eligible: false
    max_tags: 2
    values:
      core:
        description: "Foundational reference essential to ongoing projects."
        aliases: ["essential", "seminal", "must-read", "foundational"]
      high:
        description: "Highly relevant paper containing important results or techniques."
        aliases: ["important", "key-reference"]
      revisit:
        description: "Contains specific derivations, tables, or parameters to revisit later."
        aliases: ["bookmark", "check-later", "reference-back"]

  role:
    description: "Contribution style or epistemic purpose the work serves in the literature."
    kind: semantic
    classifier_eligible: true
    max_tags: 2
    values:
      review:
        description: "Synthesises an established body of literature rather than presenting only a single narrow result."
        aliases: ["review article", "survey", "overview", "systematic review", "meta-analysis"]
      empirical:
        description: "Presents primary empirical data, field/laboratory observations, or experimental measurements."
        aliases: ["experimental", "empirical study", "measurement", "observational study"]
      theoretical:
        description: "Develops formal analytical theory, mathematical derivations, or conceptual frameworks."
        aliases: ["theory", "analytical model", "conceptual framework", "formal derivation"]
      methodological:
        description: "Introduces or evaluates a new algorithm, experimental protocol, measurement tool, or analytical workflow."
        aliases: ["methodology", "algorithm development", "protocol", "new method"]
      computational:
        description: "Presents numerical simulations, scientific computing models, or computational software tools."
        aliases: ["simulation", "in silico", "numerical study", "computational model"]
      application:
        description: "Applies established methodologies to investigate a specific domain target or practical case study."
        aliases: ["case study", "applied study", "field application"]
      commentary:
        description: "Editorial, commentary, position paper, or perspective on field directions."
        aliases: ["perspective", "editorial", "position paper", "opinion"]

  topic:
    description: "Substantive domain phenomena, research questions, theories, or mechanisms."
    kind: semantic
    classifier_eligible: true
    max_tags: 4
    values:
      electrical-engineering:
        description: "Power systems, renewable grid integration, microelectronics, RF engineering, and signal processing."
        aliases: ["power grid", "microelectronics", "signal processing", "RF", "semiconductor devices", "VLSI"]
      mechanical-engineering:
        description: "Solid mechanics, thermodynamics, fluid dynamics, heat transfer, and tribology."
        aliases: ["fluid mechanics", "heat transfer", "thermodynamics", "tribology", "finite element analysis"]
      chemical-engineering:
        description: "Process intensification, separation processes, reaction engineering, fluidization, and scaling."
        aliases: ["reactor design", "process control", "separation process", "mass transfer", "distillation"]
      civil-engineering:
        description: "Structural engineering, concrete/steel design, geotechnical mechanics, and transportation engineering."
        aliases: ["structural engineering", "geotechnical", "concrete", "transportation infrastructure", "seismic design"]
      aerospace-engineering:
        description: "Aerodynamics, propulsion systems, flight dynamics, satellite mechanics, and composite structures."
        aliases: ["aerodynamics", "propulsion", "flight control", "avionics", "spacecraft"]
      robotics:
        description: "Kinematics, autonomous navigation, robotic manipulation, control theory, and soft robotics."
        aliases: ["control systems", "autonomous robot", "manipulation", "SLAM", "soft robotics", "actuators"]
      materials-engineering:
        description: "Alloy design, ceramics, composite fabrication, failure analysis, and additive manufacturing."
        aliases: ["alloys", "composites", "failure analysis", "additive manufacturing", "metallurgy"]
      manufacturing:
        description: "Industry 4.0, computer-aided design (CAD/CAM), machining, quality control, and supply chain manufacturing."
        aliases: ["CAD/CAM", "machining", "industry 4.0", "lean manufacturing", "process optimization"]

  system:
    description: "Physical, biological, social, or computational entity under primary study."
    kind: semantic
    classifier_eligible: true
    max_tags: 3
    values:
      mechanical-structures:
        description: "Turbines, engines, airframes, bridges, pressure vessels, and robotic mechanisms."
        aliases: ["turbine", "engine", "bridge", "airframe", "robot arm"]
      power-and-energy-systems:
        description: "Inverters, smart grids, battery packs, wind farms, and photovoltaic arrays."
        aliases: ["smart grid", "inverter", "battery pack", "wind turbine"]
      chemical-reactors:
        description: "Packed bed reactors, distillation columns, membrane modules, and microreactors."
        aliases: ["reactor", "distillation column", "membrane unit"]
      electronic-circuits:
        description: "Integrated circuits (ICs), PCB boards, sensor nodes, and power converters."
        aliases: ["IC", "PCB", "converter", "microcontroller"]
      engineered-materials:
        description: "High-entropy alloys, carbon fiber composites, functional ceramics, and metamaterials."
        aliases: ["alloy", "carbon fiber", "composite material"]

  method:
    description: "Investigative, computational, analytical, or experimental techniques applied."
    kind: semantic
    classifier_eligible: true
    max_tags: 3
    values:
      finite-element-analysis:
        description: "Structural stress analysis (FEA), modal analysis, and dynamic crash simulation."
        aliases: ["FEA", "finite element", "stress analysis", "ansys"]
      computational-fluid-dynamics:
        description: "Navier-Stokes solvers, turbulence modeling (LES/RANS), and aerodynamic simulation."
        aliases: ["CFD", "LES", "RANS", "fluent", "openfoam"]
      experimental-prototyping:
        description: "3D printing, wind tunnel testing, tensile load testing, and benchtop prototyping."
        aliases: ["wind tunnel", "tensile test", "rapid prototyping", "3D printing"]
      control-system-design:
        description: "PID control, model predictive control (MPC), state-space feedback, and Kalman filtering."
        aliases: ["MPC", "PID", "kalman filter", "state space control"]
      characterisation-testing:
        description: "Scanning electron microscopy (SEM), fatigue testing, non-destructive testing (NDT), and vibration test."
        aliases: ["SEM", "fatigue test", "NDT", "vibration analysis"]
