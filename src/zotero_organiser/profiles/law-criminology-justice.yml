schema_version: 1
version: "1.0.0"

description: >
  Covers legal systems, public and private law, international law, commercial and environmental law, criminology, justice and regulation.

conventions:
  separator: "/"
  canonical_tag_format: "{namespace}/{value}"
  allow_unlisted_values: false
  prefer_precision_over_recall: true
  avoid_metadata_duplication: true
  metadata_fields_not_to_tag:
    - author
    - journal
    - year
    - doi
    - publisher
    - institution
  notes:
    - "Collections/folders organize projects; tags reflect intrinsic content."
    - "Role describes contribution style (empirical, theoretical, review, method)."
    - "Topic describes substantive domain questions, phenomena, or theories."
    - "System describes the physical, biological, conceptual, or social entity investigated."
    - "Method describes specific investigative techniques, protocols, or models."
    - "Status and priority are human-managed workflow namespaces."

classifier:
  semantic_namespaces:
    - role
    - topic
    - system
    - method
  workflow_namespaces:
    - status
  human_only_namespaces:
    - priority
  rules:
    - "Never invent a tag not defined in this taxonomy."
    - "Do not tag a concept merely because it is mentioned in passing."
    - "Prefer the most specific applicable canonical tag without adding redundant synonyms."
    - "Do not infer priority or reading status from document content."
    - "Use aliases only for recognition and normalisation; always emit the canonical tag."

relationships: []

namespaces:

  status:
    description: "Reading and processing workflow state."
    kind: workflow
    classifier_eligible: false
    max_tags: 1
    mutually_exclusive: true
    user_managed:
      - reading
      - read
      - processed
    values:
      needs-triage:
        description: "Item requires human review or candidate tags await confirmation."
        aliases: ["triage", "needs review", "needs-review"]
      to-read:
        description: "Item has been queued into the reading list."
        aliases: ["unread", "to read", "to_read"]
      reading:
        description: "Item is actively being read."
      read:
        description: "Item has been read and understood."
        aliases: ["done"]
      processed:
        description: "Notes or knowledge have been extracted into broader research workflow."

  priority:
    description: "User judgement about importance or urgency to revisit."
    kind: judgement
    classifier_eligible: false
    max_tags: 2
    values:
      core:
        description: "Foundational reference essential to ongoing projects."
        aliases: ["essential", "seminal", "must-read", "foundational"]
      high:
        description: "Highly relevant paper containing important results or techniques."
        aliases: ["important", "key-reference"]
      revisit:
        description: "Contains specific derivations, tables, or parameters to revisit later."
        aliases: ["bookmark", "check-later", "reference-back"]

  role:
    description: "Contribution style or epistemic purpose the work serves in the literature."
    kind: semantic
    classifier_eligible: true
    max_tags: 2
    values:
      review:
        description: "Synthesises an established body of literature rather than presenting only a single narrow result."
        aliases: ["review article", "survey", "overview", "systematic review", "meta-analysis"]
      empirical:
        description: "Presents primary empirical data, field/laboratory observations, or experimental measurements."
        aliases: ["experimental", "empirical study", "measurement", "observational study"]
      theoretical:
        description: "Develops formal analytical theory, mathematical derivations, or conceptual frameworks."
        aliases: ["theory", "analytical model", "conceptual framework", "formal derivation"]
      methodological:
        description: "Introduces or evaluates a new algorithm, experimental protocol, measurement tool, or analytical workflow."
        aliases: ["methodology", "algorithm development", "protocol", "new method"]
      computational:
        description: "Presents numerical simulations, scientific computing models, or computational software tools."
        aliases: ["simulation", "in silico", "numerical study", "computational model"]
      application:
        description: "Applies established methodologies to investigate a specific domain target or practical case study."
        aliases: ["case study", "applied study", "field application"]
      commentary:
        description: "Editorial, commentary, position paper, or perspective on field directions."
        aliases: ["perspective", "editorial", "position paper", "opinion"]

  topic:
    description: "Substantive domain phenomena, research questions, theories, or mechanisms."
    kind: semantic
    classifier_eligible: true
    max_tags: 4
    values:
      public-law:
        description: "Constitutional law, administrative law, judicial review, statutory interpretation, and human rights."
        aliases: ["constitutional law", "administrative law", "judicial review", "human rights law"]
      private-law:
        description: "Contract law, tort law, property law, equity, trusts, and obligations."
        aliases: ["contract law", "tort law", "property law", "equity and trusts", "remedies"]
      international-law:
        description: "Public international law, treaties, laws of armed conflict, international humanitarian law, and sovereignty."
        aliases: ["treaty law", "international humanitarian law", "UNCLOS", "sovereignty"]
      commercial-law:
        description: "Corporate governance law, intellectual property (IP), competition/antitrust, and trade law."
        aliases: ["corporate law", "intellectual property", "antitrust", "trade law", "patent law"]
      environmental-law:
        description: "Climate litigation, planning law, biodiversity protection, water rights, and resources law."
        aliases: ["climate litigation", "environmental regulation", "water law", "planning law"]
      criminology:
        description: "Theories of offending, victimology, crime prevention, penology, and desistance."
        aliases: ["victimology", "criminological theory", "crime prevention", "desistance", "penology"]
      criminal-justice:
        description: "Policing, court systems, sentencing practices, corrections, parole, and restorative justice."
        aliases: ["policing", "sentencing", "corrections", "courts", "restorative justice", "prisons"]
      regulation-and-compliance:
        description: "Responsive regulation, financial regulation, cyber law, AI governance, and compliance frameworks."
        aliases: ["regulatory governance", "cyber law", "AI regulation", "compliance", "data privacy law"]

  system:
    description: "Physical, biological, social, or computational entity under primary study."
    kind: semantic
    classifier_eligible: true
    max_tags: 3
    values:
      legal-and-court-systems:
        description: "Supreme courts, appellate courts, tribunals, and arbitral bodies."
        aliases: ["court", "tribunal", "judiciary", "arbitration panel"]
      correctional-and-police-agencies:
        description: "Prisons, police departments, parole boards, and law enforcement agencies."
        aliases: ["police", "prison", "correctional facility", "parole board"]
      regulatory-bodies:
        description: "Financial regulators, competition authorities, and environmental protection agencies."
        aliases: ["regulator", "antitrust authority", "privacy commissioner"]
      legal-instruments:
        description: "Statutes, international conventions, contracts, patents, and judicial precedents."
        aliases: ["statute", "treaty", "judicial precedent", "contract"]

  method:
    description: "Investigative, computational, analytical, or experimental techniques applied."
    kind: semantic
    classifier_eligible: true
    max_tags: 3
    values:
      doctrinal-legal-analysis:
        description: "Analysis of case law precedents, statutory construction, and legal synthesis."
        aliases: ["doctrinal analysis", "case law analysis", "statutory interpretation"]
      empirical-legal-studies:
        description: "Quantitative court docket analysis, sentencing regression models, and judicial analytics."
        aliases: ["empirical legal", "court data analysis", "sentencing statistics"]
      criminological-survey-and-interviews:
        description: "Victimization surveys, offender interviews, and self-report delinquency scales."
        aliases: ["victimization survey", "offender interview", "self-report survey"]
      comparative-legal-methods:
        description: "Cross-jurisdictional legal comparisons and harmonization analysis."
        aliases: ["comparative law", "cross-jurisdiction"]
      socio-legal-fieldwork:
        description: "Courtroom observation, police ride-alongs, and ethnographic legal studies."
        aliases: ["court observation", "socio-legal", "legal ethnography"]
