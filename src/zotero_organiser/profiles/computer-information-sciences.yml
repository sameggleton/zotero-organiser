schema_version: 1
version: "1.0.0"

description: >
  Covers computer science, AI, data science, software, information systems and computing infrastructure.

conventions:
  separator: "/"
  canonical_tag_format: "{namespace}/{value}"
  allow_unlisted_values: false
  prefer_precision_over_recall: true
  avoid_metadata_duplication: true
  metadata_fields_not_to_tag:
    - author
    - journal
    - year
    - doi
    - publisher
    - institution
  notes:
    - "Collections/folders organize projects; tags reflect intrinsic content."
    - "Role describes contribution style (empirical, theoretical, review, method)."
    - "Topic describes substantive domain questions, phenomena, or theories."
    - "System describes the physical, biological, conceptual, or social entity investigated."
    - "Method describes specific investigative techniques, protocols, or models."
    - "Status and priority are human-managed workflow namespaces."

classifier:
  semantic_namespaces:
    - role
    - topic
    - system
    - method
  workflow_namespaces:
    - status
  human_only_namespaces:
    - priority
  rules:
    - "Never invent a tag not defined in this taxonomy."
    - "Do not tag a concept merely because it is mentioned in passing."
    - "Prefer the most specific applicable canonical tag without adding redundant synonyms."
    - "Do not infer priority or reading status from document content."
    - "Use aliases only for recognition and normalisation; always emit the canonical tag."

relationships: []

namespaces:

  status:
    description: "Reading and processing workflow state."
    kind: workflow
    classifier_eligible: false
    max_tags: 1
    mutually_exclusive: true
    user_managed:
      - reading
      - read
      - processed
    values:
      needs-triage:
        description: "Item requires human review or candidate tags await confirmation."
        aliases: ["triage", "needs review", "needs-review"]
      to-read:
        description: "Item has been queued into the reading list."
        aliases: ["unread", "to read", "to_read"]
      reading:
        description: "Item is actively being read."
      read:
        description: "Item has been read and understood."
        aliases: ["done"]
      processed:
        description: "Notes or knowledge have been extracted into broader research workflow."

  priority:
    description: "User judgement about importance or urgency to revisit."
    kind: judgement
    classifier_eligible: false
    max_tags: 2
    values:
      core:
        description: "Foundational reference essential to ongoing projects."
        aliases: ["essential", "seminal", "must-read", "foundational"]
      high:
        description: "Highly relevant paper containing important results or techniques."
        aliases: ["important", "key-reference"]
      revisit:
        description: "Contains specific derivations, tables, or parameters to revisit later."
        aliases: ["bookmark", "check-later", "reference-back"]

  role:
    description: "Contribution style or epistemic purpose the work serves in the literature."
    kind: semantic
    classifier_eligible: true
    max_tags: 2
    values:
      review:
        description: "Synthesises an established body of literature rather than presenting only a single narrow result."
        aliases: ["review article", "survey", "overview", "systematic review", "meta-analysis"]
      empirical:
        description: "Presents primary empirical data, field/laboratory observations, or experimental measurements."
        aliases: ["experimental", "empirical study", "measurement", "observational study"]
      theoretical:
        description: "Develops formal analytical theory, mathematical derivations, or conceptual frameworks."
        aliases: ["theory", "analytical model", "conceptual framework", "formal derivation"]
      methodological:
        description: "Introduces or evaluates a new algorithm, experimental protocol, measurement tool, or analytical workflow."
        aliases: ["methodology", "algorithm development", "protocol", "new method"]
      computational:
        description: "Presents numerical simulations, scientific computing models, or computational software tools."
        aliases: ["simulation", "in silico", "numerical study", "computational model"]
      application:
        description: "Applies established methodologies to investigate a specific domain target or practical case study."
        aliases: ["case study", "applied study", "field application"]
      commentary:
        description: "Editorial, commentary, position paper, or perspective on field directions."
        aliases: ["perspective", "editorial", "position paper", "opinion"]

  topic:
    description: "Substantive domain phenomena, research questions, theories, or mechanisms."
    kind: semantic
    classifier_eligible: true
    max_tags: 4
    values:
      machine-learning:
        description: "Supervised, unsupervised, reinforcement learning, deep architectures, and neural representations."
        aliases: ["deep learning", "neural network", "reinforcement learning", "representation learning", "transformer"]
      artificial-intelligence:
        description: "Knowledge representation, automated reasoning, heuristic search, planning, and multi-agent systems."
        aliases: ["knowledge graph", "automated reasoning", "planning", "agent-based AI", "heuristic search"]
      algorithms:
        description: "Complexity theory, approximation algorithms, randomized algorithms, graph algorithms, and data structures."
        aliases: ["complexity theory", "data structures", "approximation algorithms", "graph algorithms"]
      software-engineering:
        description: "Software architecture, program verification, testing, CI/CD, static analysis, and code synthesis."
        aliases: ["testing", "static analysis", "program verification", "code synthesis", "software architecture"]
      distributed-systems:
        description: "Consensus protocols, cloud computing, edge computing, distributed storage, and microservices."
        aliases: ["cloud computing", "consensus", "paxos", "raft", "microservices", "edge computing"]
      cybersecurity:
        description: "Cryptography, network security, vulnerability analysis, threat modeling, and zero-trust systems."
        aliases: ["cryptography", "zero trust", "threat modeling", "vulnerability", "encryption"]
      data-science:
        description: "Big data analytics, data mining, feature engineering, information retrieval, and knowledge discovery."
        aliases: ["data mining", "information retrieval", "big data", "feature engineering", "RAG"]
      human-computer-interaction:
        description: "User interface design, usability evaluation, interactive computing, and accessibility."
        aliases: ["HCI", "UX", "user interface", "usability", "interaction design"]
      computer-vision:
        description: "Image recognition, object detection, 3D reconstruction, vision-language models, and generative visual AI."
        aliases: ["vision-language", "object detection", "image segmentation", "3D vision"]
      natural-language-processing:
        description: "Large language models, machine translation, syntax parsing, text generation, and speech processing."
        aliases: ["NLP", "LLM", "speech recognition", "machine translation", "text generation"]

  system:
    description: "Physical, biological, social, or computational entity under primary study."
    kind: semantic
    classifier_eligible: true
    max_tags: 3
    values:
      software-systems:
        description: "Applications, compilers, operating systems, frameworks, and programming runtimes."
        aliases: ["compiler", "runtime", "operating system", "framework", "library"]
      distributed-infrastructure:
        description: "Cloud clusters, Kubernetes, datacenters, peer-to-peer networks, and edge nodes."
        aliases: ["cloud cluster", "kubernetes", "datacenter", "p2p"]
      neural-models:
        description: "Foundation models, convolutional networks, transformers, diffusion models, and GNNs."
        aliases: ["foundation model", "transformer", "diffusion model", "GNN"]
      hardware-architectures:
        description: "GPUs, TPUs, ASICs, neuromorphic chips, and quantum processing units (QPUs)."
        aliases: ["GPU", "TPU", "ASIC", "accelerator", "QPU"]
      information-networks:
        description: "The World Wide Web, semantic web, social graphs, and knowledge repositories."
        aliases: ["knowledge base", "social network", "semantic web"]

  method:
    description: "Investigative, computational, analytical, or experimental techniques applied."
    kind: semantic
    classifier_eligible: true
    max_tags: 3
    values:
      algorithmic-design:
        description: "Algorithm specification, asymptotic complexity proof, and correctness verification."
        aliases: ["algorithm proof", "complexity bound"]
      model-training:
        description: "Backpropagation, gradient descent, hyperparameter tuning, and distributed training."
        aliases: ["training", "fine-tuning", "LoRA", "gradient descent"]
      empirical-benchmarking:
        description: "Standard test suites, ablation studies, latency profiling, and comparative benchmarks."
        aliases: ["benchmark", "ablation", "comparative study"]
      formal-verification:
        description: "Model checking, theorem proving (Coq/Lean), and formal specification validation."
        aliases: ["model checking", "formal proof", "lean", "coq"]
      user-study:
        description: "Task evaluation, controlled usability experiments, cognitive walkthroughs, and telemetry."
        aliases: ["usability test", "controlled study", "user telemetry"]
