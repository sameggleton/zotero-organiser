schema_version: 1
version: "1.0.0"

description: >
  Covers economic theory, applied economics, econometrics, macroeconomics, microeconomics, labour, development, public and behavioural economics.

conventions:
  separator: "/"
  canonical_tag_format: "{namespace}/{value}"
  allow_unlisted_values: false
  prefer_precision_over_recall: true
  avoid_metadata_duplication: true
  metadata_fields_not_to_tag:
    - author
    - journal
    - year
    - doi
    - publisher
    - institution
  notes:
    - "Collections/folders organize projects; tags reflect intrinsic content."
    - "Role describes contribution style (empirical, theoretical, review, method)."
    - "Topic describes substantive domain questions, phenomena, or theories."
    - "System describes the physical, biological, conceptual, or social entity investigated."
    - "Method describes specific investigative techniques, protocols, or models."
    - "Status and priority are human-managed workflow namespaces."

classifier:
  semantic_namespaces:
    - role
    - topic
    - system
    - method
  workflow_namespaces:
    - status
  human_only_namespaces:
    - priority
  rules:
    - "Never invent a tag not defined in this taxonomy."
    - "Do not tag a concept merely because it is mentioned in passing."
    - "Prefer the most specific applicable canonical tag without adding redundant synonyms."
    - "Do not infer priority or reading status from document content."
    - "Use aliases only for recognition and normalisation; always emit the canonical tag."

relationships: []

namespaces:

  status:
    description: "Reading and processing workflow state."
    kind: workflow
    classifier_eligible: false
    max_tags: 1
    mutually_exclusive: true
    user_managed:
      - reading
      - read
      - processed
    values:
      needs-triage:
        description: "Item requires human review or candidate tags await confirmation."
        aliases: ["triage", "needs review", "needs-review"]
      to-read:
        description: "Item has been queued into the reading list."
        aliases: ["unread", "to read", "to_read"]
      reading:
        description: "Item is actively being read."
      read:
        description: "Item has been read and understood."
        aliases: ["done"]
      processed:
        description: "Notes or knowledge have been extracted into broader research workflow."

  priority:
    description: "User judgement about importance or urgency to revisit."
    kind: judgement
    classifier_eligible: false
    max_tags: 2
    values:
      core:
        description: "Foundational reference essential to ongoing projects."
        aliases: ["essential", "seminal", "must-read", "foundational"]
      high:
        description: "Highly relevant paper containing important results or techniques."
        aliases: ["important", "key-reference"]
      revisit:
        description: "Contains specific derivations, tables, or parameters to revisit later."
        aliases: ["bookmark", "check-later", "reference-back"]

  role:
    description: "Contribution style or epistemic purpose the work serves in the literature."
    kind: semantic
    classifier_eligible: true
    max_tags: 2
    values:
      review:
        description: "Synthesises an established body of literature rather than presenting only a single narrow result."
        aliases: ["review article", "survey", "overview", "systematic review", "meta-analysis"]
      empirical:
        description: "Presents primary empirical data, field/laboratory observations, or experimental measurements."
        aliases: ["experimental", "empirical study", "measurement", "observational study"]
      theoretical:
        description: "Develops formal analytical theory, mathematical derivations, or conceptual frameworks."
        aliases: ["theory", "analytical model", "conceptual framework", "formal derivation"]
      methodological:
        description: "Introduces or evaluates a new algorithm, experimental protocol, measurement tool, or analytical workflow."
        aliases: ["methodology", "algorithm development", "protocol", "new method"]
      computational:
        description: "Presents numerical simulations, scientific computing models, or computational software tools."
        aliases: ["simulation", "in silico", "numerical study", "computational model"]
      application:
        description: "Applies established methodologies to investigate a specific domain target or practical case study."
        aliases: ["case study", "applied study", "field application"]
      commentary:
        description: "Editorial, commentary, position paper, or perspective on field directions."
        aliases: ["perspective", "editorial", "position paper", "opinion"]

  topic:
    description: "Substantive domain phenomena, research questions, theories, or mechanisms."
    kind: semantic
    classifier_eligible: true
    max_tags: 4
    values:
      econometrics:
        description: "Identification strategies, panel data methods, instrumental variables (IV), and time-series econometrics."
        aliases: ["instrumental variables", "difference-in-differences", "panel data", "time series", "causal identification"]
      macroeconomics:
        description: "Monetary policy, fiscal policy, business cycles, inflation, economic growth, and DSGE modeling."
        aliases: ["monetary policy", "fiscal policy", "inflation", "business cycle", "DSGE", "growth theory"]
      microeconomics:
        description: "Game theory, mechanism design, consumer choice, market equilibrium, and industrial organisation."
        aliases: ["game theory", "mechanism design", "industrial organization", "market structure", "pricing"]
      labour-economics:
        description: "Wage inequality, employment, human capital, labor market friction, and migration economics."
        aliases: ["wage inequality", "employment", "human capital", "minimum wage", "labor market"]
      development-economics:
        description: "Poverty traps, microcredit, foreign aid, institutional economics, and randomized evaluations."
        aliases: ["poverty", "microfinance", "RCT development", "institutions", "economic development"]
      public-economics:
        description: "Taxation theory, public goods, social insurance, redistribution, and fiscal federalism."
        aliases: ["taxation", "public goods", "social insurance", "redistribution", "welfare economics"]
      behavioural-economics:
        description: "Time inconsistency, social preferences, bounded rationality, nudges, and behavioral games."
        aliases: ["nudge", "time inconsistency", "loss aversion", "behavioral finance", "social preferences"]

  system:
    description: "Physical, biological, social, or computational entity under primary study."
    kind: semantic
    classifier_eligible: true
    max_tags: 3
    values:
      national-economies:
        description: "OECD economies, emerging markets, central banking systems, and currency areas."
        aliases: ["national economy", "central bank", "emerging market", "eurozone"]
      markets-and-firms:
        description: "Oligopolies, competitive markets, labor markets, and auction platforms."
        aliases: ["firm", "market", "auction", "industry"]
      households-and-workers:
        description: "Representative consumers, worker cohorts, household panels, and low-income families."
        aliases: ["household", "worker", "consumer cohort"]
      economic-datasets:
        description: "Census data, administrative tax records, central bank time-series, and household surveys."
        aliases: ["census data", "tax records", "household survey", "panel study"]

  method:
    description: "Investigative, computational, analytical, or experimental techniques applied."
    kind: semantic
    classifier_eligible: true
    max_tags: 3
    values:
      quasi-experimental-econometrics:
        description: "Difference-in-differences (DiD), regression discontinuity (RD), and synthetic controls."
        aliases: ["DiD", "regression discontinuity", "synthetic control", "event study"]
      structural-estimation:
        description: "Dynamic discrete choice, generalized method of moments (GMM), and maximum simulated likelihood."
        aliases: ["structural model", "GMM", "dynamic discrete choice"]
      macroeconomic-dsge-simulation:
        description: "Dynamic stochastic general equilibrium (DSGE) solving, calibration, and Bayesian estimation."
        aliases: ["DSGE", "calibration", "VAR", "vector autoregression"]
      randomized-control-trials:
        description: "Field experiments, intervention trials, and A/B policy evaluations."
        aliases: ["field experiment", "RCT economics", "policy evaluation"]
      game-theoretic-proof:
        description: "Nash equilibrium analysis, subgame perfection, and auction mechanism proofs."
        aliases: ["nash equilibrium", "mechanism proof", "subgame perfect"]
