[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zotero-organiser"
dynamic = ["version"]
description = "Conservative, backup-gated Zotero tag organiser"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{ name = "Sam Eggleton" }]
keywords = ["zotero", "bibliography", "tagging", "python"]
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.8", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/sameggleton/zotero-organiser"
Repository = "https://github.com/sameggleton/zotero-organiser"
Issues = "https://github.com/sameggleton/zotero-organiser/issues"
Changelog = "https://github.com/sameggleton/zotero-organiser/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
ranker = ["fastembed>=0.7"]
ranker-gpu = ["fastembed-gpu>=0.7"]
local-classifier = ["torch>=2.5", "transformers>=4.48"]

[project.scripts]
zotero-organiser = "zotero_organiser.cli:main"

[tool.hatch.version]
path = "src/zotero_organiser/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_organiser"]

[tool.hatch.build.targets.wheel.force-include]
"src/zotero_organiser/taxonomy.yml" = "zotero_organiser/taxonomy.yml"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
